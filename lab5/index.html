<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lab5</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>
<body>

    <section>
        <h2>Перетворення температури</h2>
        <div class="field-row">
            <label for="fahrenheitInput">Температура за Фаренгейтом</label>
            <input type="text" id="fahrenheitInput" />
        </div>
        <div class="field-row">
            <label for="celsiusInput">Температура за Цельсієм</label>
            <input type="text" id="celsiusInput" />
        </div>
    </section>

    <section>
        <h2>Перевірка таблиці множення</h2>
        <div id="score2" class="score"></div>
        <div class="controls">
            <button id="next2">наступне завдання</button>
        </div>
        <div class="answer-row">
            <span id="task2" class="task-text"></span>
            <input type="text" id="answer2" />
            <button id="check2">перевірити</button>
        </div>
        <div id="result2" class="message"></div>
    </section>

    <section>
        <h2>Таблиця множення з вибором відповіді</h2>
        <div id="score3" class="score"></div>
        <div class="controls">
            <button id="next3">наступне завдання</button>
        </div>
        <div id="task3" class="task-text"></div>
        <div id="options3" class="options"></div>
        <div id="result3" class="message"></div>
    </section>

    <section>
        <h2>Перелистування зображень</h2>
        <div id="rotator"></div>
    </section>

    <section>
        <h2>Капча</h2>
        <div id="captcha"></div>
    </section>

</body>
</html>
