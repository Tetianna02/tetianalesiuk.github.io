<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lab4</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>
<body>

    <section>
        <h2>Робота з об'єктами</h2>
        <div id="task1Source"></div>
        <div class="controls">
            <button id="bookInfoBtn">Вивести інформацію про книгу</button>
            <button id="toggleReadBtn">Змінити статус прочитання</button>
        </div>
        <div id="task1Result" class="result"></div>
    </section>

    <section>
        <h2>Робота з масивами та об'єктами</h2>
        <div class="controls">
            <button id="displayLibraryBtn">Показати бібліотеку</button>
            <button id="pushBookBtn">Додати книгу «The Great Gatsby»</button>
        </div>
        <div id="task2Result" class="result"></div>
    </section>

    <section>
        <h2>Робота з методами масивів</h2>
        <div class="controls">
            <button id="sortYearBtn">Сортувати за роком видання</button>
            <button id="unreadBooksBtn">Непрочитані книги</button>
            <button id="tolkienBtn">Знайти книгу Толкіна</button>
        </div>
        <div id="task3Result" class="result"></div>
    </section>

    <section>
        <h2>Взаємодія з користувачем</h2>
        <div class="controls">
            <button id="addBookBtn">Додати нову книгу</button>
        </div>
        <div id="task4Result" class="result"></div>
    </section>

    <section>
        <h2>Додаткові завдання до прикладів</h2>
        <div id="extraSource"></div>
        <div class="controls">
            <button id="averageYearBtn">Середній рік видання</button>
        </div>
        <div id="extraResult" class="result"></div>
    </section>

    <section>
        <h2>Колекція коміксів</h2>
        <div id="comicsSource"></div>
        <div class="controls">
            <button id="addComicBtn">Додати комікс</button>
            <button id="sortComicsBtn">Сортувати за роком випуску</button>
            <button id="missingComicsBtn">Комікси, яких немає в колекції</button>
            <button id="comicsAverageBtn">Середній рік випуску</button>
        </div>
        <div class="controls">
            <input type="text" id="comicAuthorInput" placeholder="Автор коміксу" />
            <button id="findComicBtn">Знайти комікс автора</button>
        </div>
        <div id="comicsResult" class="result"></div>
    </section>

</body>
</html>
