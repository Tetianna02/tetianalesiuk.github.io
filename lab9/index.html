<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lab9</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>
<body>

    <section>
        <h2>Завдання 4: Порівняння чисел</h2>
        <form id="compareForm">
            <div class="field-row">
                <label for="firstNumber">Перше число</label>
                <input type="number" id="firstNumber" step="any" required />
            </div>
            <div class="field-row">
                <label for="secondNumber">Друге число</label>
                <input type="number" id="secondNumber" step="any" required />
            </div>
            <button type="submit">Порівняти</button>
        </form>
    </section>

    <section>
        <h2>Завдання 5: Сума трьох випадкових чисел</h2>
        <button type="button" id="sumButton">Обчислити суму</button>
    </section>

    <section id="output" aria-busy="false">
        <h2>Результат</h2>
        <div id="loader" role="status" aria-label="Обчислення">
            <span class="spinner" aria-hidden="true"></span>
            <span>Очікування результату…</span>
        </div>
        <div id="result" class="result" role="status" aria-live="polite">Оберіть завдання.</div>
    </section>

</body>
</html>
