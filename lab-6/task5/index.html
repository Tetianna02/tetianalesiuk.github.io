<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Бургер Меню</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrapper">
    <div class="promo-card">
      
      <div class="promo-left">
        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=800" alt="Бургер" class="main-img">
        
        <div class="promo-overlay">
          <h2 class="promo-title">БУРГЕР-<br>ITALIAN !</h2>
          <p class="promo-price">
            <span class="price-label">УСЬОГО</span> 
            <span class="price-number">79 ГРН</span>
          </p>
        </div>
      </div>

      <div class="promo-right">
        <p class="promo-slogan">Лови момент!</p>
        <div class="menu-grid">
          <div class="menu-item"><span class="menu-name">MICHIGAN</span><span class="menu-price">64.00 ГРН</span></div>
          <div class="menu-item"><span class="menu-name">Beef BBQ</span><span class="menu-price">59.00 ГРН</span></div>
          <div class="menu-item"><span class="menu-name">Cheeseburger</span><span class="menu-price">59.00 ГРН</span></div>
          <div class="menu-item"><span class="menu-name">KETCHUP ROOM</span><span class="menu-price">68.00 ГРН</span></div>
          <div class="menu-item"><span class="menu-name">KETCHUP ROOM 2</span><span class="menu-price">72.00 ГРН</span></div>
          <div class="menu-item"><span class="menu-name">ELVIS</span><span class="menu-price">55.00 ГРН</span></div>
        </div>
      </div>
    </div>

    <div class="btn-wrap">
      <a href="#" class="btn-all-menu">ВСЕ МЕНЮ</a>
    </div>
  </div>

</body>
</html>
