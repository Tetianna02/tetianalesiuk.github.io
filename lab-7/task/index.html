<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог iPhone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <h1 class="page-title">ОБОВ'ЯЗКОВО ДОДАЙТЕ СВОЄ ЗАМОВЛЕННЯ</h1>

    <div class="catalog-wrapper">

      <button class="arrow arrow-left" aria-label="Назад">&lt;</button>

      <div class="catalog-grid">

        <!-- Картка 1: iPhone 17 Pro — НОВИНКА, незабаром у продажі -->
        <div class="card">
          <div class="badge badge--new">НОВИНКА</div>
          <p class="card-category">ФЛАГМАН</p>
          <div class="card-image">
            <img
              src="https://cdn.comfy.ua/media/catalog/product/cache/5/image/600x/9df78eab33525d08d6e5fb8d27136e95/i/p/iphone_17_pro_cosmic_orange_pdp_image_position_1__ce-ww_2.jpg"
              alt="iPhone 17 Pro"
              onerror="this.src='https://via.placeholder.com/160x200/f0f0f0/999?text=iPhone+17+Pro'"
            >
          </div>
          <a href="https://www.apple.com/ua/iphone/" target="_blank" class="card-name">iPhone 17 Pro</a>
          <p class="card-price">&nbsp;</p>
          <a href="https://www.apple.com/ua/iphone/" target="_blank" class="btn btn--soon">НЕЗАБАРОМ<br>У ПРОДАЖІ</a>
        </div>

        <!-- Картка 2: iPhone 15 -->
        <div class="card">
          <p class="card-category">ПОПУЛЯРНИЙ</p>
          <div class="card-image">
            <img
              src="https://fdn2.gsmarena.com/vv/pics/apple/apple-iphone-15-1.jpg"
              alt="iPhone 15"
              onerror="this.src='https://via.placeholder.com/160x200/f0f0f0/999?text=iPhone+15'"
            >
          </div>
          <a href="https://www.apple.com/ua/iphone-15/" target="_blank" class="card-name">iPhone 15</a>
          <p class="card-price">
            <span class="price-current">39 999 ГРН</span>
          </p>
          <a href="https://rozetka.com.ua/ua/apple_iphone_15/p418031851/" target="_blank" class="btn btn--buy">У КОШИК</a>
        </div>

        <!-- Картка 3: iPhone 13 Pro — ХІТ ПРОДАЖІВ -->
        <div class="card">
          <div class="badge badge--hit">ХІТ<br>ПРОДАЖІВ</div>
          <p class="card-category">ХІТ ПРОДАЖІВ</p>
          <div class="card-image">
            <img
              src="https://fdn2.gsmarena.com/vv/pics/apple/apple-iphone-13-pro-01.jpg"
              alt="iPhone 13 Pro"
              onerror="this.src='https://via.placeholder.com/160x200/f0f0f0/999?text=iPhone+13+Pro'"
            >
          </div>
          <a href="https://rozetka.com.ua/ua/apple_iphone_13_pro/p421301/" target="_blank" class="card-name">iPhone 13 Pro</a>
          <p class="card-price">
            <span class="price-old">38 999 ГРН</span>
            <span class="price-current">29 999 ГРН</span>
          </p>
          <a href="https://rozetka.com.ua/ua/apple_iphone_13_pro/p421301/" target="_blank" class="btn btn--buy">У КОШИК</a>
        </div>

        <!-- Картка 4: iPhone SE — ХІТ ПРОДАЖІВ -->
        <div class="card">
          <div class="badge badge--hit">ХІТ<br>ПРОДАЖІВ</div>
          <p class="card-category">БЮДЖЕТНИЙ</p>
          <div class="card-image">
            <img
              src="https://fdn2.gsmarena.com/vv/pics/apple/apple-iphone-se-2022-1.jpg"
              alt="iPhone SE"
              onerror="this.src='https://via.placeholder.com/160x200/f0f0f0/999?text=iPhone+SE'"
            >
          </div>
          <a href="https://www.apple.com/ua/iphone-se/" target="_blank" class="card-name">iPhone SE (3-го покоління)</a>
          <p class="card-price">
            <span class="price-old">11 999 ГРН</span>
            <span class="price-current">9 999 ГРН</span>
          </p>
          <a href="https://rozetka.com.ua/ua/apple_iphone_se_2022/p418032601/" target="_blank" class="btn btn--buy">У КОШИК</a>
        </div>

      </div>

      <button class="arrow arrow-right" aria-label="Далі">&gt;</button>

    </div>

  </div>

</body>
</html>
